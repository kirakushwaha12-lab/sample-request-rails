<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sample Request Sheet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* =========================================================
   OUTSIDE PRINT BUTTON
========================================================= */

        .top-bar {
            width: 210mm;
            max-width: calc(100% - 30px);
            margin: 25px auto 12px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .print-btn {
            border: none;
            background: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .print-btn:hover {
            opacity: .9;
        }

        /* =========================================================
   A4 PORTRAIT SHEET
========================================================= */

        .sheet {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 30px;
            background: white;
            padding: 12mm;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .12);
        }

        .created-by {
            font-size: 10px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 6px;
        }

        /* =========================================================
   TITLE
========================================================= */

        .sheet-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* =========================================================
   TABLE
========================================================= */

        .main-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .main-table th,
        .main-table td {
            border: 1px solid #222;
            vertical-align: top;
        }

        .main-table th {
            width: 36%;
            padding: 7px 8px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
        }

        .main-table td {
            width: 64%;
            padding: 7px 8px;
            font-size: 11px;
            line-height: 1.4;
            word-break: break-word;
        }

        /* =========================================================
   ARTICLE HEADER
========================================================= */

        .article-heading {
            background: #f1f1f1;
            text-align: center !important;
            font-size: 12px !important;
            padding: 8px !important;
        }

        /* =========================================================
   REQUEST INFORMATION
========================================================= */

        .request-info td {
            font-weight: 600;
        }

        /* =========================================================
   VALUE LIST
========================================================= */

        .value-list {
            margin: 0;
            padding-left: 18px;
        }

        .value-list li {
            margin-bottom: 2px;
        }

        .no-value {
            color: #777;
        }

        /* =========================================================
   IMAGES
========================================================= */

        .image-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .image-item {
            width: 115px;
            text-align: center;
        }

        .image-item img {
            width: 110px;
            height: 85px;
            object-fit: contain;
            border: 1px solid #aaa;
            display: block;
            background: #fafafa;
        }

        .image-name {
            font-size: 8px;
            margin-top: 3px;
            word-break: break-word;
        }

        /* =========================================================
   MESSAGE
========================================================= */

        .message {
            width: 210mm;
            max-width: calc(100% - 30px);
            margin: 30px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
        }

        .hidden {
            display: none;
        }

        /* =========================================================
   PRINT
========================================================= */

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {

            body {
                background: white;
            }

            .top-bar {
                display: none;
            }

            .sheet {
                width: 210mm;
                min-height: 297mm;
                margin: 0;
                padding: 12mm;
                box-shadow: none;
            }

            .message {
                display: none;
            }

            tr {
                page-break-inside: avoid;
            }

        }

        /* =========================================================
   MOBILE
========================================================= */

        @media (max-width: 800px) {

            .top-bar {
                width: auto;
            }

            .sheet {
                width: calc(100% - 20px);
                min-height: auto;
                padding: 15px;
            }

        }
    </style>
</head>

<body>

    <!-- =======================================================
     OUTSIDE THE SHEET
     ONLY PRINT BUTTON
======================================================== -->

    <div class="top-bar">

        <button type="button" class="print-btn" onclick="printSheet()">
            Save / Print as PDF
        </button>

    </div>

    <!-- =======================================================
     LOADING MESSAGE
======================================================== -->

    <div id="message" class="message">
        Loading Sample Request...
    </div>

    <!-- =======================================================
     SAMPLE REQUEST SHEET
======================================================== -->

    <div id="sampleSheet" class="sheet hidden">

        <div class="created-by">
            Created By: <span id="createdBy">-</span>
        </div>

        <div class="sheet-title">
            Sample Request Sheet
        </div>

        <!-- ===================================================
         REQUEST INFORMATION
    ==================================================== -->

        <table class="main-table request-info">

            <tbody>

                <tr>
                    <th>
                        Client Code
                    </th>

                    <td id="clientCode">
                        -
                    </td>
                </tr>

                <tr>
                    <th>
                        Inquiry Received Date
                    </th>

                    <td id="inquiryReceivedDate">
                        -
                    </td>
                </tr>

                <tr>
                    <th>
                        Request ID
                    </th>

                    <td id="requestId">
                        -
                    </td>
                </tr>

                <tr>
                    <th>
                        Status
                    </th>

                    <td id="status">
                        -
                    </td>
                </tr>

            </tbody>

        </table>

        <br>

        <!-- ===================================================
         ARTICLES
    ==================================================== -->

        <div id="articlesContainer"></div>

    </div>


    <script>

        /* =========================================================
           API BASE URL
        ========================================================= */

        const API_BASE_URL = "http://localhost:3000/api/sample-requests";


        /* =========================================================
           GET SELECTED REQUEST ID
        ========================================================= */

        function getSelectedRequestId() {

            /*
               Requests List VIEW button ab selected request ko
               localStorage me temporary handoff karega.
            */

            const data =
                localStorage.getItem("selectedSampleRequest");

            if (!data) {
                return null;
            }

            try {

                const request =
                    JSON.parse(data);

                if (!request) {
                    return null;
                }

                return (
                    request.requestId ||
                    request.request_id ||
                    null
                );

            } catch (error) {

                console.error(
                    "Selected request parse error:",
                    error
                );

                return null;
            }
        }


        /* =========================================================
           GET CREATED BY FROM SQL DATA
        ========================================================= */

        function getCreatedByFromRequest(request) {

            if (!request) {
                return "-";
            }

            /*
               Backend JOIN se user_id / name / department aa sakta hai.
            */

            const possibleValues = [

                request.name,

                request.user_id,

                request.created_by_name,

                request.created_by_user_id

            ];

            for (const value of possibleValues) {

                if (
                    value !== undefined &&
                    value !== null &&
                    String(value).trim() !== ""
                ) {

                    return String(value).trim();

                }

            }

            /*
               Fallback:
               Agar old temporary localStorage user data available hai.
            */

            const possibleKeys = [
                "userData",
                "currentUser",
                "loggedInUser",
                "user"
            ];

            for (const key of possibleKeys) {

                const data =
                    localStorage.getItem(key);

                if (!data) {
                    continue;
                }

                try {

                    const user =
                        JSON.parse(data);

                    if (!user) {
                        continue;
                    }

                    const possibleNames = [

                        user.name,

                        user.fullName,

                        user.full_name,

                        user.username,

                        user.user_id,

                        user.userId,

                        user.login_id

                    ];

                    for (const name of possibleNames) {

                        if (
                            name !== undefined &&
                            name !== null &&
                            String(name).trim() !== ""
                        ) {

                            return String(name).trim();

                        }

                    }

                } catch (error) {

                    // Ignore invalid localStorage data

                }

            }

            return "-";
        }


        /* =========================================================
           DATE FORMAT
        ========================================================= */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "-";
            }

            const value =
                String(dateValue);

            /*
               PostgreSQL DATE normally comes as YYYY-MM-DD.
            */

            if (
                /^\d{4}-\d{2}-\d{2}$/.test(value)
            ) {

                const parts =
                    value.split("-");

                return (
                    parts[2] +
                    "/" +
                    parts[1] +
                    "/" +
                    parts[0]
                );

            }

            /*
               PostgreSQL timestamp/date string
               e.g. 2026-09-01T00:00:00.000Z
            */

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return value;

            }

            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );

        }


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           CONVERT SQL TEXT VALUE TO DISPLAY VALUE
        ========================================================= */

        function normalizeArrayValue(value) {

            if (
                value === undefined ||
                value === null ||
                value === ""
            ) {

                return [];

            }

            if (Array.isArray(value)) {

                return value.filter(
                    item =>
                        item !== undefined &&
                        item !== null &&
                        String(item).trim() !== ""
                );

            }

            /*
               Frontend multiple-select values are stored in
               PostgreSQL TEXT columns as comma-separated text.
        
               Example:
               "Leather A,Leather B"
            */

            const stringValue =
                String(value).trim();

            if (!stringValue) {
                return [];
            }

            /*
               Handle PostgreSQL array format too,
               in case an older record contains:
               {Leather A,Leather B}
            */

            if (
                stringValue.startsWith("{") &&
                stringValue.endsWith("}")
            ) {

                const inner =
                    stringValue.slice(
                        1,
                        -1
                    );

                if (!inner.trim()) {
                    return [];
                }

                return inner
                    .split(",")
                    .map(
                        item =>
                            item
                                .trim()
                                .replace(/^"|"$/g, "")
                    )
                    .filter(Boolean);

            }

            return stringValue
                .split(",")
                .map(
                    item =>
                        item.trim()
                )
                .filter(Boolean);

        }


        /* =========================================================
           DISPLAY VALUE
        ========================================================= */

        function displayValue(value) {

            if (
                value === undefined ||
                value === null ||
                value === ""
            ) {

                return '<span class="no-value">-</span>';

            }


            if (Array.isArray(value)) {

                const filtered =
                    value.filter(
                        item =>
                            item !== undefined &&
                            item !== null &&
                            String(item).trim() !== ""
                    );


                if (filtered.length === 0) {

                    return '<span class="no-value">-</span>';

                }


                return `
            <ul class="value-list">

                ${filtered.map(
                    item =>
                        `<li>${escapeHtml(item)}</li>`
                ).join("")
                    }

            </ul>
        `;

            }


            return escapeHtml(value);

        }


        /* =========================================================
           CREATE IMAGE HTML
        ========================================================= */

        function createImagesHtml(images) {

            if (
                !Array.isArray(images) ||
                images.length === 0
            ) {

                return '<span class="no-value">-</span>';

            }


            const validImages =
                images.filter(
                    image =>
                        image &&
                        image.data
                );


            if (validImages.length === 0) {

                return '<span class="no-value">-</span>';

            }


            return `
        <div class="image-area">

            ${validImages.map(image => {

                return `
                        <div class="image-item">

                            <img
                                src="${image.data}"
                                alt="${escapeHtml(
                    image.name || "Image"
                )}"
                            >

        

                        </div>
                    `;

            }).join("")
                }

        </div>
    `;

        }


        /* =========================================================
           CREATE TABLE ROW
        ========================================================= */

        function createRow(
            label,
            value
        ) {

            return `

        <tr>

            <th>
                ${escapeHtml(label)}
            </th>

            <td>
                ${displayValue(value)}
            </td>

        </tr>

    `;

        }


        /* =========================================================
           CREATE ARTICLE TABLE
        ========================================================= */

        function createArticleTable(
            article,
            index
        ) {

            /*
               SQL column names -> display values
        
               article_no
               fabric_canvas
               hardware_finish
               raw_edge_folded_edge
               edge_color
               puller_tab
               sample_dispatch_date
               branding_images
               reference_images
            */


            const articleNo =
                article.articleNo ??
                article.article_no;

            const articleType =
                article.articleType ??
                article.article_type;

            const leather =
                normalizeArrayValue(
                    article.leather
                );

            const lining =
                normalizeArrayValue(
                    article.lining
                );

            const hardware =
                normalizeArrayValue(
                    article.hardware
                );

            const thread =
                normalizeArrayValue(
                    article.thread
                );


            const fabricCanvas =
                article.fabricCanvas ??
                article.fabric_canvas;

            const hardware_finish =
                normalizeArrayValue(
                    article.hardware_finish
                );

            const webbing =
                normalizeArrayValue(
                    article.webbing
                );

            const rawEdgeFoldedEdge =
                article.rawEdgeFoldedEdge ??
                article.raw_edge_folded_edge;

            const edgeColor =
                article.edgeColor ??
                article.edge_color;

            const pullerTab =
                article.pullerTab ??
                article.puller_tab;

            const zipper =
                normalizeArrayValue(
                    article.zipper
                );

            const brandingImages =
                article.brandingImages ??
                article.branding_images ??
                [];

            const changes =
                article.changes;

            const sampleDispatchDate =
                article.sampleDispatchDate ??
                article.sample_dispatch_date;

            const referenceImages =
                article.referenceImages ??
                article.reference_images ??
                [];


            return `

        <table class="main-table">

            <tbody>

                <tr>

                    <th
                        colspan="2"
                        class="article-heading"
                    >
                        Article ${index + 1}
                    </th>

                </tr>


                ${createRow(
                "Article No.",
                articleNo
            )}

                ${createRow(
                "Article Type",
                articleType
            )}

                ${createRow(
                "Leather",
                leather
            )}


                ${createRow(
                "Lining",
                lining
            )}


                ${createRow(
                "Hardware",
                hardware
            )}


                ${createRow(
                "Thread",
                thread
            )}

                ${createRow(
                "Fabric / Canvas",
                fabricCanvas
            )}


                ${createRow(
                "Hardware Finish",
                hardware_finish
            )}


                ${createRow(
                "Webbing",
                webbing
            )}


                ${createRow(
                "Raw Edge / Folded Edge",
                rawEdgeFoldedEdge
            )}


                ${createRow(
                "Edge Color",
                edgeColor
            )}


                ${createRow(
                "Puller Tab",
                pullerTab
            )}


                ${createRow(
                "Zipper",
                zipper
            )}


                <tr>

                    <th>
                        Branding
                    </th>

                    <td>
                        ${createImagesHtml(
                brandingImages
            )}
                    </td>

                </tr>


                ${createRow(
                "Changes",
                changes
            )}


                ${createRow(
                "Sample Dispatch Date",
                formatDate(
                    sampleDispatchDate
                )
            )}


                <tr>

                    <th>
                        Reference Images
                    </th>

                    <td>
                        ${createImagesHtml(
                referenceImages
            )}
                    </td>

                </tr>

            </tbody>

        </table>

        <div style="height: 10px;"></div>

    `;

        }


        /* =========================================================
           FETCH REQUEST FROM SQL
        ========================================================= */

        async function fetchRequestFromSQL(requestId) {

            if (!requestId) {
                return null;
            }

            const response =
                await fetch(
                    `${API_BASE_URL}/${encodeURIComponent(requestId)}`
                );

            if (!response.ok) {

                throw new Error(
                    `Failed to load sample request (${response.status})`
                );

            }

            const request =
                await response.json();

            return request;

        }


        /* =========================================================
           LOAD SHEET
        ========================================================= */

        async function loadSheet() {

            const message =
                document.getElementById(
                    "message"
                );

            const sampleSheet =
                document.getElementById(
                    "sampleSheet"
                );


            try {

                const requestId =
                    getSelectedRequestId();


                if (!requestId) {

                    message.textContent =
                        "No Sample Request selected.";

                    return;

                }


                /*
                   IMPORTANT:
        
                   Data ab localStorage se directly nahi,
                   PostgreSQL API se aa raha hai.
                */

                const request =
                    await fetchRequestFromSQL(
                        requestId
                    );


                if (!request) {

                    message.textContent =
                        "Sample Request not found.";

                    return;

                }


                /* =================================================
                   CREATED BY
                ================================================= */

                document.getElementById(
                    "createdBy"
                ).textContent =
                    getCreatedByFromRequest(
                        request
                    );


                /* =================================================
                   REQUEST INFORMATION
                ================================================= */

                document.getElementById(
                    "clientCode"
                ).textContent =
                    request.client_code ??
                    request.clientCode ??
                    "-";


                document.getElementById(
                    "inquiryReceivedDate"
                ).textContent =
                    formatDate(
                        request.inquiry_received_date ??
                        request.inquiryReceivedDate
                    );


                document.getElementById(
                    "requestId"
                ).textContent =
                    request.request_id ??
                    request.requestId ??
                    "-";


                document.getElementById(
                    "status"
                ).textContent =
                    request.status ||
                    "SUBMITTED";


                /* =================================================
                   ARTICLES
                ================================================= */

                const container =
                    document.getElementById(
                        "articlesContainer"
                    );


                container.innerHTML = "";


                const articles =
                    Array.isArray(
                        request.articles
                    )
                        ? request.articles
                        : [];


                if (articles.length === 0) {

                    container.innerHTML = `

                <table class="main-table">

                    <tbody>

                        <tr>

                            <td
                                style="
                                    text-align:center;
                                    padding:20px;
                                "
                            >
                                No articles found.
                            </td>

                        </tr>

                    </tbody>

                </table>

            `;

                } else {

                    articles.forEach(
                        (article, index) => {

                            container.innerHTML +=
                                createArticleTable(
                                    article,
                                    index
                                );

                        }
                    );

                }


                /* =================================================
                   SHOW SHEET
                ================================================= */

                message.classList.add(
                    "hidden"
                );

                sampleSheet.classList.remove(
                    "hidden"
                );


            } catch (error) {

                console.error(
                    "Load Sample Request Sheet Error:",
                    error
                );

                message.textContent =
                    "Failed to load Sample Request.";

            }

        }


        /* =========================================================
           PRINT
        ========================================================= */

        function printSheet() {

            window.print();

        }


        /* =========================================================
           START
        ========================================================= */

        loadSheet();

    </script>

</body>

</html>
