<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accept Invitation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .message {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .password-section {
            display: none;
            margin-top: 25px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            text-align: center;
        }

        .success {
            color: #16a34a;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Invitation</h2>

    <p class="message" id="invitationMessage">
        You have been invited to use the Sample Request Automation system.
    </p>

    <!-- Confirmation -->
    <div id="confirmationSection">

        <button id="confirmButton">
            Confirm Invitation
        </button>

    </div>

    <!-- Password Setup -->
    <div class="password-section" id="passwordSection">

        <div class="field">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Enter your password"
            >
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
            >
        </div>

        <button id="setPasswordButton">
            Set Password
        </button>

    </div>

    <p id="statusMessage"></p>

</div>


<script>

    const API_BASE = "http://localhost:3000/api";

    // Get invitation token from URL
    const urlParams = new URLSearchParams(window.location.search);

    const invitationToken = urlParams.get("token");

    const confirmationSection =
        document.getElementById("confirmationSection");

    const passwordSection =
        document.getElementById("passwordSection");

    const confirmButton =
        document.getElementById("confirmButton");

    const setPasswordButton =
        document.getElementById("setPasswordButton");

    const statusMessage =
        document.getElementById("statusMessage");


    // Check token
    if (!invitationToken) {

        confirmationSection.style.display = "none";

        statusMessage.textContent =
            "Invalid invitation link.";

        statusMessage.className = "error";
    }


    // Confirm invitation
    confirmButton.addEventListener("click", async () => {

        confirmationSection.style.display = "none";

        passwordSection.style.display = "block";

        document.getElementById("invitationMessage").textContent =
            "Invitation accepted. Please create your password.";

    });


    // Set password
    setPasswordButton.addEventListener("click", async () => {

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (!newPassword || !confirmPassword) {

            statusMessage.textContent =
                "Please enter and confirm your password.";

            statusMessage.className = "error";

            return;
        }


        if (newPassword !== confirmPassword) {

            statusMessage.textContent =
                "Passwords do not match.";

            statusMessage.className = "error";

            return;
        }


        if (newPassword.length < 6) {

            statusMessage.textContent =
                "Password must be at least 6 characters.";

            statusMessage.className = "error";

            return;
        }


        try {

            const response = await fetch(
                `${API_BASE}/auth/accept-invitation`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: invitationToken,
                        newPassword: newPassword
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                statusMessage.textContent =
                    data.message || "Failed to set password.";

                statusMessage.className = "error";

                return;
            }


            statusMessage.textContent =
                "Password created successfully. You can now login.";

            statusMessage.className = "success";


            setPasswordButton.disabled = true;


            setTimeout(() => {

                window.location.href = "login1.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            statusMessage.textContent =
                "Unable to connect to the server.";

            statusMessage.className = "error";
        }

    });

</script>

</body>
</html>
